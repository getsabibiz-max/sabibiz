name: Generate Business Directory Pages

on:
  # Run manually from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dateutil

      - name: Generate business pages
        run: |
          python generate_biz_pages.py

      - name: Commit and push changes (if any)
        run: |
          git config user.name "sabibiz-bot"
          git config user.email "actions@users.noreply.github.com"

          git add biz/ sitemap.xml

          if git diff --cached --quiet; then
            echo "✅ No changes detected."
          else
            git commit -m "Auto-update business directory pages [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "✅ Business directory updated successfully."
          fi
